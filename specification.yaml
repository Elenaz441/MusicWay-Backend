openapi: 3.0.3
info:
  title: MusicWay
  description: Спецификация для основного сервера без маршрутов для админки.
  version: 1.0.0

tags:
  - name: Auth
    description: Авторизация
  - name: User
    description: Действия с пользователями
  - name: Topic Block
    description: Действия с разделами
  - name: Study material
    description: Действия с учебными материалами
  - name: Feedback
    description: Действия с обратной связью
  - name: Variant
    description: Действия с вариантами типов заданий
  - name: Task
    description: Действия с упражнениями
  - name: Class
    description: Действия с классами
  - name: Homework
    description: Действия с домашними заданиями

paths:
  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Регистрация пользователя
      description: Регистрация нового пользователя.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegister'
        required: true
      responses:
        '201':
          description: Пользователь зарегистрирован.
          content:
            application/json:
              schema: {}
        '409':
          description: Пользователь с таким email или phone уже существует
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/auth/login:
    get:
      tags:
        - Auth
      summary: Проверка состояния пользователя
      description: Возвращает информацию по авторизованному пользователю
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema: {}
        '401':
          description: Аутентификация не пройдена
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
    post:
      tags:
        - Auth
      summary: Авторизация пользователя
      description: Авторизует пользователя на основе почты и пароля
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Body_login_api_v1_auth_login_post'
        required: true
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Почта или пароль неверные
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      summary: Обновление токенов
      description: Обновление refresh и access токенов.
      requestBody:
        description: Refresh token.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
        required: true
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Токен для обновления не валиден
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/auth/logout:
    delete:
      tags:
        - Auth
      summary: Выход пользователя
      description: Выход пользователя из личного кабинета
      responses:
        '204':
          description: ОК
          content:
            application/json:
              schema: {}
        '400':
          description: Неверный токен
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/auth/change-password:
    patch:
      tags:
        - Auth
      summary: Смена пароля
      description: Смена пароля. Маршрут для смены пароля при первой авторизации преподавателя и администратора.
      requestBody:
        description: Новый пароль пользователя
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/users/statistic:
    get:
      tags:
        - User
      summary: Получение статистики выполнения заданий
      description: Получение статистики выполнения домашних заданий по ученику.
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserStatistic'
        '401':
          description: Пользователь не авторизован
        '403':
          description: Ошибка прав доступа
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/topic-blocks:
    get:
      tags:
        - Topic Block
      summary: Получение списка разделов
      description: Получение списка разделов.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TopicBlockResponse'
                type: array
                title: Response Get Topic Blocks Api V1 Topic Blocks Get
        '401':
          description: Пользователь не авторизован
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/topic-blocks/{block_id}/statistic:
    get:
      tags:
        - Topic Block
      summary: Получение статистики по разделу
      description: Получение статистики по разделу с процентом успешности выполнения по каждому варианту задания.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: block_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Block Id
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariantStatistic'
                title: >-
                  Response Get Topic Block Statistic Api V1 Topic Blocks  Block
                  Id  Statistic Get
        '401':
          description: Пользователь не авторизован
        '403':
          description: Ошибка прав доступа
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/materials:
    get:
      tags:
        - Study material
      summary: Получение списка учебных материалов по разделу
      description: Получение списка учебных материалов в виде их заголовков.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: block_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            title: Block Id
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortMaterialResponse'
                title: Response Get Materials Api V1 Materials Get
        '400':
          description: Ошибка в данных, которые отправил пользователь (не указан id раздела)
        '401':
          description: Пользователь не авторизован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/materials/{material_id}/video:
    get:
      tags:
        - Study material
      summary: Видео из учебному материалу
      description: Возвращает ссылку на видео из учебного материала.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialVideoResponse'
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найден учебный материал с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/materials/{material_id}/text:
    get:
      tags:
        - Study material
      summary: Тескт из учебного материала
      description: Возвращает текст из одного учебного материала.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaterialTextResponse'
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найден учебный материал с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/materials/{material_id}/tasks:
    get:
      tags:
        - Study material
      summary: Информация по учебному материалу
      description: Возвращает детальную информацию по одному учебному материалу.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Material Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/VariantForActiveTask'
                title: >-
                  Response Get Material Tasks Api V1 Materials  Material Id 
                  Tasks Get
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найден учебный материал с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/materials/search:
    get:
      tags:
        - Study material
      summary: Получение списка учебных материалов
      description: Получение списка учебных материалов по ключевым словам.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            title: Query
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortMaterialResponse'
                title: Response Get Materials Api V1 Materials Search Get
        '401':
          description: Пользователь не авторизован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/feedbacks:
    post:
      tags:
        - Feedback
      summary: Отправка обратной связи
      description: Отправка обратной связи по учебному материалу от преподавателя.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFeedback'
        required: true
      responses:
        '201':
          description: ОК
          content:
            application/json:
              schema: {}
        '400':
          description: Ошибка в данных, которые отправил пользователь
        '401':
          description: Пользователь не авторизован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/variants:
    get:
      tags:
        - Variant
      summary: Получение вариантов упражнений
      description: Получение вариантов упражнений по разделу.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: block_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
            title: Block Id
      responses:
        '200':
          description: ОК
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortVariantResponse'
                title: Response Get Variants Api V1 Variants Get
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найдены варианты по block_id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/variants/{variant_id}:
    get:
      tags:
        - Variant
      summary: Информация по варианту задания
      description: Возвращает детальную информацию по варианту типа задания.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: variant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Variant Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VariantResponse'
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найден вариант с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/tasks:
    post:
      tags:
        - Task
      summary: Создание упражнения
      description: Создание упражнения по настройкам пользователя.
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VariantForCreateTask'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: string
                format: uuid
                title: Response Create Task Api V1 Tasks Post
        '400':
          description: Ошибка в данных, которые отправил пользователь
        '401':
          description: Пользователь не авторизован
        '403':
          description: Нет прав на создание
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/tasks/{task_id}:
    get:
      tags:
        - Task
      summary: Получение упражнения
      description: Получение упражнения.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Task Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
              examples:
                task_definition_by_ear:
                  summary: Определение на слух
                  value:
                    id: 6329c3d6a04ab1061c6425ea
                    condition: string
                    task_type_variant: string
                    description: string
                    content:
                      image_url: string
                      image_name: Моцарт
                      audio_urls:
                        - url: string
                      intervals:
                        - name: Б.3

                task_singing:
                  summary: Пропевание
                  value:
                    id: 6329c3d6a04ab1061c6425ea
                    condition: string
                    task_type_variant: string
                    description: string
                    content:

                task_melody:
                  summary: Мелодия на пианино
                  value:
                    id: 6329c3d6a04ab1061c6425ea
                    condition: string
                    task_type_variant: string
                    description: string
                    content:
                      initial_note: До
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найдено упражнение с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/tasks/{material_id}/{variant_id}/{task_number}:
    get:
      tags:
        - Task
      summary: Получение упражнения из материала
      description: Получение упражнения из учебного материала.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: material_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Material Id
        - name: variant_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Variant Id
        - name: task_number
          in: path
          required: true
          schema:
            type: integer
            title: Task Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найдено упражнение
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/tasks/{homework_id}/{task_number}:
    get:
      tags:
        - Task
      summary: Получение упражнения по дз
      description: Получение упражнения.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: homework_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Homework Id
        - name: task_number
          in: path
          required: true
          schema:
            type: integer
            title: Task Number
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '401':
          description: Пользователь не авторизован
        '404':
          description: Не найдено упражнение
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/tasks/{task_id}/check:
    post:
      tags:
        - Task
      summary: Проверка ответа пользователя
      description: Проверка ответа пользователя.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: task_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Task Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSubmit'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskAnswer'
        '400':
          description: Ошибка в данных, которые отправил пользователь
        '401':
          description: Пользователь не авторизован
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/classes:
    get:
      tags:
        - Class
      summary: Получение списка классов
      description: Получение списка классов.
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/ShortClassResponse'
                type: array
                title: Response Get Classes Api V1 Classes Get
        '401':
          description: Пользователь не авторизован
        '403':
          description: Ошибка прав доступа
        '500':
          description: Ошибка сервера
      security:
        - OAuth2PasswordBearer: []
  /api/v1/classes/{class_id}:
    get:
      tags:
        - Class
      summary: Информация по классу
      description: Возвращает детальную информацию по одному классу.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassResponse'
        '401':
          description: Пользователь не авторизован
        '403':
          description: Ошибка прав доступа
        '404':
          description: Не найден класс с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/classes/{class_id}/last_homework:
    get:
      tags:
        - Class
      summary: Прошедшие ДЗ у класса
      description: Получение прошедших домашних заданий у класса.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
            title: Class Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShortLastHWTeacher'
                title: >-
                  Response Get Class Last Homework Api V1 Classes  Class Id 
                  Last Homework Get
        '401':
          description: Пользователь не авторизован
        '403':
          description: Ошибка прав доступа
        '404':
          description: Не найден класс с таким id
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '500':
          description: Ошибка сервера
  /api/v1/classes/{class_id}/statistic:
    get:
      tags:
        - Class
      summary: Получение статистики по классу
      description: Получение статистики по классу за последние три месяца.
      security:
        - OAuth2PasswordBearer: []
      parameters:
        - name: class_id
          in: path
          required: true
          schema:
            type: string
