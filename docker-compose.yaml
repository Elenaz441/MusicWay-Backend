version: "3.9"

services:
  db:
    image: postgres:12-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    networks:
      - fastapiappnetwork

  adminer:
    image: adminer
    restart: always
    ports:
      - "1234:8080"
    networks:
      - fastapiappnetwork

  redis:
    image: redis:6.2
    ports:
      - "6379:6379"
    environment:
      - REDIS_HOST=$REDIS_HOST
      - REDIS_PORT=$REDIS_PORT
      - REDIS_PASSWORD=$REDIS_PASSWORD
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks:
      - fastapiappnetwork

  app:
    build: .
    container_name: app-main
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - /src/.env
    depends_on:
      - db
      - redis
    networks:
      - fastapiappnetwork

networks:
  fastapiappnetwork: