version: "3.9"

services:
  db:
    image: postgres:12-alpine
    container_name: db-ear
    restart: always
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=$POSTGRES_DB
      - POSTGRES_USER=$POSTGRES_USER
      - POSTGRES_PASSWORD=$POSTGRES_PASSWORD
    networks:
      - app-ear

  adminer:
    image: adminer
    container_name: adminer-ear
    restart: always
    ports:
      - "1235:8080"
    networks:
      - app-ear

  app:
    build: .
    container_name: app-ear
    restart: always
    ports:
      - "8001:8000"
    env_file:
      - /src/.env
    depends_on:
      - db
    networks:
      - app-ear

networks:
  app-ear: